# lefthook.yml's `extends` always wins over lefthook.yml's own settings (lefthook's merge order
# is: lefthook.yml -> extends -> remotes -> lefthook-local.yml), so overriding an inherited
# command has to happen here, the only file with higher precedence than `extends`.
#
# The shared lefthook/lefthook.yml's commit-msg hook points at
# node_modules/@arnaud-zg/configs/lefthook/check-commit-msg.sh, correct for a consumer who has
# installed this package, but this repo doesn't install itself as its own dependency. This file
# is committed (not gitignored) since the override applies to every contributor, not just one
# developer's machine.
commit-msg:
  commands:
    check-format:
      run: sh lefthook/check-commit-msg.sh {1}
      skip: [rebase]
